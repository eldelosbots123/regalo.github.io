<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icono.png">
    <title>Te amup💗</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #F8F7F4;
            padding: 15px;
        }

        main {
            width: 450px;
            height: 350px;
            max-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #DDF3FA;
            user-select: none;
            border-radius: 20px;
        }

        #arriba {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-family: font;
            color: #24566B;
        }

        #contador {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #dias {
            font-size: 35px;
        }

        #abajo {
            display: flex;
            gap: 15px;
            font-size: 20px;
        }

        #regalo {
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: default;
            background: #8CCFE3;
            border-radius: 0 0 20px 20px;
            font-size: 25px;
            transition: background 0.4s, transform 0.15s;
        }

        #regalo.abierto {
            background: #F3A6C8;
            cursor: pointer;
        }

        #regalo.abierto:active {
            background: #E889B2;
            transform: scale(0.98);
        }

        @font-face {
            font-family: font;
            src: url("ngaco.otf");
        }

        /* CELULAR */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            main {
                width: 100%;
                height: 300px;
                border-radius: 18px;
            }

            #dias {
                font-size: 30px;
            }

            #abajo {
                gap: 10px;
                font-size: 18px;
            }

            #regalo {
                height: 65px;
                border-radius: 0 0 18px 18px;
            }
        }
    </style>
</head>

<body>
    <main>
        <div id="arriba">
            <div id="contador">
                <span id="dias">0d</span>
                <div id="abajo">
                    <span id="horas">0h</span>

                    <span id="segundos">0s</span>

</body>
</html>
